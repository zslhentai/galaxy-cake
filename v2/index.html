<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#090e20">
  <meta name="description" content="一件可以旋转、近看与点烛的星空生日蛋糕。">
  <meta property="og:title" content="星河许愿 2.0">
  <meta property="og:description" content="点亮星河，许一个只属于你的生日愿望。">
  <title>星河许愿 · A Wish in the Stars</title>
  <link rel="stylesheet" href="./atelier.css?v=2">
</head>
<body data-phase="opening">
  <main class="room">
    <div class="wash" aria-hidden="true"></div>
    <canvas id="sky" aria-hidden="true"></canvas>
    <header class="mast">
      <span class="brand"><span aria-hidden="true">✦</span> 星河许愿</span>
      <a class="quiet-link" href="./notes.html">作品手记</a>
    </header>
    <div class="copy">
      <p class="eyebrow">A BIRTHDAY WISH</p>
      <h1>星河许愿</h1>
      <p class="english" lang="en">A wish in the stars</p>
      <p id="caption">有些愿望，只说给今晚的星星听。</p>
      <button id="ceremony" class="ceremony" type="button"><span aria-hidden="true">✧</span><span id="ceremony-label">点亮星河</span></button>
      <p id="status" class="status" role="status"></p>
    </div>
    <section class="exhibit" aria-label="星空蛋糕展台">
      <div class="stage">
        <img id="poster" class="poster" src="./assets/poster.webp" width="360" height="385" alt="">
        <canvas id="cake" tabindex="-1" aria-hidden="true" aria-label="星空蛋糕视图" aria-describedby="gesture-help"></canvas>
      </div>

    </section>
    <footer class="tools">
      <div class="views" role="group" aria-label="蛋糕视角">
        <button type="button" data-camera="zoom-out" aria-label="缩小" title="缩小">−</button>
        <button type="button" data-camera="reset" aria-label="复位视角" title="复位视角">↺</button>
        <button type="button" data-camera="zoom-in" aria-label="放大" title="放大">+</button>
      </div>
      <p id="gesture-help"><span class="desktop-help">拖动旋转 · 滚轮缩放</span><span class="phone-help">拖动旋转 · 双指缩放</span></p>
      <button type="button" id="sound" class="sound" aria-label="背景音乐" aria-pressed="false" title="背景音乐"><span aria-hidden="true" class="audio-wave"><i></i><i></i><i></i><i></i></span></button>
    </footer>
    <pre id="diagnostics" hidden></pre>
  </main>
  <audio id="bgm" src="../视频转音频 2026年11月18日 23:37.m4a" preload="none" loop></audio>
  <script type="module" src="./atelier.js?v=2"></script>
</body>
</html>
